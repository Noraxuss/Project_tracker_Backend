spring:
  datasource:
    url: jdbc:mysql://<your-planetscale-database-url>:3306/<your-database-name>
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: <your-username>
    password: <your-password>
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

server:
  port: 8080

logging:
  level:
    org:
      springframework:
        web: DEBUG