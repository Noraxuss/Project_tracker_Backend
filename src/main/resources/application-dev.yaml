spring:
  datasource:
    url: jdbc:mysql://localhost:8080/feedback_intern
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: test
    password: develop
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  sql:
    init:
      mode: always

server:
  port: 3306

logging:
  level:
    org:
      springframework:
        web: DEBUG